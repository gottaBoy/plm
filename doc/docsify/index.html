<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>产品生命周期管理系统文档</title>
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta name="description" content="Description">
		<!-- 设置浏览器图标 -->
		<link rel="icon" href="data:," />
		<!-- The checked-in Docsify runtime is the only required document dependency. -->
        <link rel="stylesheet" href="css/local-theme.css">
        <link rel="stylesheet" href="css/main.css">
		<!-- <link rel="stylesheet" href="//gcore.jsdelivr.net/npm/font-awesome/css/font-awesome.min.css" >-->
		<!-- <link rel="stylesheet" href="//gcore.jsdelivr.net/npm/docsify/lib/themes/vue.css" /> -->
		<!-- <link rel="stylesheet" href="//gcore.jsdelivr.net/npm/docsify/lib/themes/buble.css" /> -->
		<!-- <link rel="stylesheet" href="//gcore.jsdelivr.net/npm/docsify/lib/themes/dark.css" /> -->
		<!-- <link rel="stylesheet" href="//gcore.jsdelivr.net/npm/docsify/lib/themes/pure.css" /> -->
	</head>

	<body>
	    <div id="app">
            <div data-app id="main"></div>
        </div>

        <script>
			window.$docsify = {
				el: '#main',
				// 项目名称
				name: '技术文档',
				// 项目图标
				// logo: '/img/icon.svg',
				// 仓库地址，点击右上角的Github章鱼猫头像会跳转到此地址
				// repo: 'http://172.16.180.230/full-dynamic-ftl/full-dynamic-vue',
				// 封面支持，默认加载的是项目根目录下的_coverpage.md文件
				coverpage: false,
				// 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
				loadSidebar: true,
				// 导航栏支持，默认加载的是项目根目录下的_navbar.md文件
				loadNavbar: false,
				// 最大支持渲染的标题层级
				maxLevel: 5,
				// 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级（建议配置为2-4）
				subMaxLevel: 4,
				// 小屏设备下合并导航栏到侧边栏
				mergeNavbar: true,
				// 未找到页面 _404.md
				//notFoundPage: true,
				// API reference search uses the local authority-generated bilingual index.
                copyCode: {
                    buttonText: '复制',
                    errorText: '错误',
                    successText: '已复制',
                },
				plantuml: {
					//skin: 'https://raw.githubusercontent.com/plantuml/plantuml/master/themes/puml-theme-sandstone.puml',
					skin: 'classic',
					renderAsObject: true,
			    },
			    tabs: {
                    sync: true,
                    theme: 'material'
                },
				scrollToTop: {
					text: '🔝',
				},
                'flexible-alerts': {
				},
				formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
				formatUpdated: function(time) {
					return time;
				},
				// 目标是在 markdown 中打开外部链接。默认'_blank'（新窗口/标签）
				externalLinkTarget: '_blank', // default: '_blank' '_self'
			}
		</script>
		<script src="script/aibiz-api-reference.js"></script>
		<!-- docsify的js依赖 -->
		<!-- <script src="//npmjs.ibizlab.cn/docsify/lib/docsify.min.js"></script> -->
		<script src="script/docsify.js"></script>
		<script src="script/docsify-plugin-table-fixed.js"></script>
		<!-- Optional CDN-only plugins are intentionally omitted in the local build. -->
		<!--在所有的代码块上添加一个简单的Click to copy按钮来允许用户从你的文档中轻易地复制代码-->
		<!-- 分页导航
		<script src="//npmjs.ibizlab.cn/docsify-pagination/dist/docsify-pagination.min.js"></script>
		 -->
		<!-- 外部脚本 如果页面上的脚本是外部脚本（通过src属性导入 js 文件） -->
		<!-- 插件列表 -->

	</body>
</html>
