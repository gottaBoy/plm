services:
  plmservice:
    image: aibiz/plmservice:local
    entrypoint:
      - sh
      - -c
      - exec java $${JAVA_OPTS} -jar /app/plm-provider.jar
    command: []
    volumes:
      - ../../../plm/model:/app/model:ro
    environment:
      SERVER_PORT: "30251"
      SYSTEM_NAME: ibizservicerunner
      IBIZ_SERVICEHUB_ID: ibizservicerunner
      IBIZ_SERVICEHUB_INITMODE: auto
      IBIZ_SERVICEHUB_LOCALMODE: "true"
      IBIZ_SERVICEHUB_PUBLISH_CONFIG: "false"
